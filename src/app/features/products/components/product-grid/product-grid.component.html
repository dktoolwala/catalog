<div class="product-grid" role="list" aria-label="Products">
  @for (product of products(); track product.id) {
    <div class="product-grid__item" role="listitem">
      <app-product-card
        [product]="product"
        [showPrice]="showPrices()"
        (viewClicked)="productSelected.emit($event)"
      />
    </div>
  }
</div>
